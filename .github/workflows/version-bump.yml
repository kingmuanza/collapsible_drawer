name: Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Get current version
        id: get_version
        run: |
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
      
      - name: Calculate new version
        id: new_version
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.current_version }}"
          
          # Split version into components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
      
      - name: Update pubspec.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ steps.new_version.outputs.new_version }}/" pubspec.yaml
          
          # Verify the change
          echo "Updated pubspec.yaml:"
          grep "^version:" pubspec.yaml
      
      - name: Commit version bump
        run: |
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.new_version.outputs.new_version }}"
      
      - name: Create tag
        run: |
          git tag -a "v${{ steps.new_version.outputs.new_version }}" -m "Version ${{ steps.new_version.outputs.new_version }}"
      
      - name: Push changes
        run: |
          git push origin main
          git push origin "v${{ steps.new_version.outputs.new_version }}"